<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Briefings Curiosa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: mesa de trabalho. Lista de briefings à esquerda, o briefing aberto à direita, resumo antes do detalhe. */
:root{
  --ink:#06060b; --ink-2:#0c0c16; --ink-3:#13131f; --ink-4:#1a1a29;
  --cream:#f3ecdf; --dim:rgba(243,236,223,.68); --faint:rgba(243,236,223,.44);
  --line:rgba(243,236,223,.12); --line-2:rgba(243,236,223,.24);
  --blue:#2f5bea; --violet:#7a5cf2; --lilac:#c9bcff;
  --hot:#ff9a7a; --warm:#f2d48a; --cold:#9ec3ff; --ok:#7fe0b0; --lost:#8a8594;
  --serif:"Lora",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px;border-radius:6px}
a{color:inherit}

.app{display:grid;grid-template-rows:auto 1fr;height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:22px 18px;border-bottom:1px solid var(--line)}
.ttl small{display:block;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--lilac);font-weight:600}
.ttl h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,38px);letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.ttl h1 em{color:var(--lilac)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:86px}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.demo{font-size:12.5px;color:var(--ink);background:var(--warm);border-radius:999px;padding:5px 11px;font-weight:600}

.body{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:0;min-height:0}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{display:grid;gap:10px;padding:16px 16px 14px 0}
.search{width:100%;background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
.search:focus{border-color:var(--lilac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sel{background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.list{overflow:auto;padding-right:12px;padding-bottom:24px;flex:1}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;width:100%;text-align:left;padding:14px 12px;border-radius:14px;border:1px solid transparent;margin-bottom:4px}
.item:hover{background:var(--ink-2)}
.item[aria-current="true"]{background:var(--ink-3);border-color:var(--line-2)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.t-Quente{background:var(--hot)} .t-Morno{background:var(--warm)} .t-Frio{background:var(--cold)}
.item .n{font-family:var(--serif);font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{grid-column:2;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.item .st{grid-column:3;justify-self:end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap;border:1px solid var(--line-2);color:var(--dim)}
.pill.s-Novo{border-color:var(--lilac);color:var(--lilac)}
.pill.s-Fechado{border-color:var(--ok);color:var(--ok)}
.pill.s-Perdido{color:var(--lost);border-color:var(--line)}
.pill.temp{border:0;color:var(--ink)}
.empty{color:var(--dim);padding:40px 6px;text-align:center}
.empty b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--cream);margin-bottom:6px}

.main{overflow:auto;min-width:0;padding:26px 0 60px 32px}
.back{display:none;margin-bottom:14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dh small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lilac);font-weight:600}
.dh h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 6px;text-wrap:balance}
.dh p{color:var(--dim)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.qa{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:9px 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-decoration:none;min-height:40px}
.qa:hover{background:var(--cream);color:var(--ink)}
.qa.primary{background:var(--cream);color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:18px;margin-top:24px;align-items:start}
.box{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--ink-2)}
.box h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lilac);font-weight:700;margin-bottom:10px}
.resumo{font-family:var(--serif);font-size:18px;line-height:1.55}
.pontos{list-style:none;display:grid;gap:10px;margin-top:4px}
.pontos li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px}
.pontos li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lilac);margin-top:8px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px}
.facts dt{color:var(--dim)}
.facts dd{word-break:break-word}
.stbar{display:flex;gap:6px;flex-wrap:wrap}
.stbtn{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--dim);min-height:38px}
.stbtn[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.notes{width:100%;min-height:110px;background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0;resize:vertical;margin-top:10px;line-height:1.5}
.notes:focus{border-color:var(--lilac)}
.saveline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--faint)}
.smallbtn{border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.smallbtn:hover{background:var(--cream);color:var(--ink)}

.answers{margin-top:26px}
.answers h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lilac);font-weight:700;margin:22px 0 4px}
.ans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.ans .q{color:var(--dim);font-size:14px}
.ans .a{font-family:var(--serif);font-size:16.5px;white-space:pre-wrap;word-break:break-word}
.ans .a.none{color:var(--faint);font-style:italic}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180%);background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;transition:transform .3s;z-index:20}
.toast.on{transform:translate(-50%,0)}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .ans{grid-template-columns:1fr;gap:2px}
}
@media (max-width:760px){
  .app{height:auto;min-height:100%}
  .body{grid-template-columns:1fr}
  .side{border-right:0}
  .filters{padding-right:0}
  .list{padding-right:0;overflow:visible}
  .main{padding:20px 0 60px}
  .app.open .side{display:none}
  .app:not(.open) .main{display:none}
  .back{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <header>
    <div class="ttl"><small>Curiosa House · Painel privado</small><h1>Briefings na <em>mesa</em></h1></div>
    <div class="kpis" id="kpis"></div>
  </header>
  <div class="body">
    <aside class="side" aria-label="Lista de briefings">
      <div class="filters">
        <input class="search" id="q" type="search" placeholder="Buscar por nome, empresa, e-mail" aria-label="Buscar briefings">
        <div class="row">
          <select class="sel" id="fInt" aria-label="Filtrar por interesse"><option value="">Todos os interesses</option></select>
          <select class="sel" id="fSt" aria-label="Filtrar por status"><option value="">Todos os status</option></select>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="main" id="main" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA_IN = <?!= dataJson ?>;
const KEY = <?!= keyJson ?>;
const STATUS = <?!= statusJson ?>;
const IS_DEMO = typeof google === "undefined" || !google.script;

let DATA = DATA_IN, sel = (location.hash||"").slice(1) || (DATA[0]&&DATA[0].id) || null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TEMPC = {Quente:"var(--hot)",Morno:"var(--warm)",Frio:"var(--cold)"};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}
function fdate(iso,full){ const d=new Date(iso); if(isNaN(d)) return "";
  return full? d.toLocaleString("pt-BR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}); }
const zap = w => { const d=String(w||"").replace(/\D/g,""); return d? "https://wa.me/"+(d.startsWith("55")?d:"55"+d) : ""; };

function fillFilters(){
  const ints=[...new Set(DATA.map(d=>d.interesse).filter(Boolean))];
  $("#fInt").innerHTML='<option value="">Todos os interesses</option>'+ints.map(i=>`<option>${esc(i)}</option>`).join("");
  $("#fSt").innerHTML='<option value="">Todos os status</option>'+STATUS.map(s=>`<option>${esc(s)}</option>`).join("");
}
function kpis(){
  const c=s=>DATA.filter(d=>d.status===s).length, t=s=>DATA.filter(d=>d.temperatura===s&&!["Fechado","Perdido"].includes(d.status)).length;
  $("#kpis").innerHTML = (IS_DEMO?'<span class="demo">Exemplo com dados fictícios</span>':"")+
    [["Novos",c("Novo")],["Quentes abertos",t("Quente")],["Em proposta",c("Proposta enviada")],["Fechados",c("Fechado")]]
    .map(([l,n])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join("");
}
function filtered(){
  const q=$("#q").value.trim().toLowerCase(), fi=$("#fInt").value, fs=$("#fSt").value;
  return DATA.filter(d=>(!fi||d.interesse===fi)&&(!fs||d.status===fs)&&(!q||[d.nome,d.empresa,d.email,d.instagram].join(" ").toLowerCase().includes(q)));
}
function list(){
  const L=filtered();
  $("#list").innerHTML = L.length ? L.map(d=>`<button class="item" type="button" data-id="${esc(d.id)}" aria-current="${d.id===sel}">
    <span class="dot t-${esc(d.temperatura)}" title="${esc(d.temperatura)}"></span>
    <span class="n">${esc(d.empresa||d.nome)}</span><span class="d">${fdate(d.recebido)}</span>
    <span class="s">${esc(d.nome)} · ${esc(d.interesse)}</span><span class="st"><span class="pill s-${esc(String(d.status).split(" ")[0])}">${esc(d.status)}</span></span>
  </button>`).join("")
  : DATA.length ? `<div class="empty"><b>Nada com esse filtro</b>Limpe a busca ou troque o status para ver os outros briefings.</div>`
  : `<div class="empty"><b>Nenhum briefing ainda</b>Quando um cliente enviar o formulário, ele aparece aqui e no seu e-mail.</div>`;
  document.querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>{ sel=b.dataset.id; try{ history.replaceState(null,"","#"+sel); }catch(e){} list(); detail(); $("#app").classList.add("open"); window.scrollTo({top:0}); }));
}
function detail(){
  const d=DATA.find(x=>x.id===sel);
  if(!d){ $("#main").innerHTML = `<div class="empty"><b>Escolha um briefing</b>O resumo e as respostas aparecem aqui.</div>`; return; }
  const secs=[...new Set((d.respostas||[]).map(r=>r.sec))];
  $("#main").innerHTML = `<button class="back" id="back" type="button">← Lista</button>
  <div class="dh"><div style="min-width:0">
    <small>${esc(d.id)} · recebido em ${fdate(d.recebido,true)}</small>
    <h2>${esc(d.empresa||d.nome)}</h2>
    <p>${esc(d.nome)}${d.cargo?", "+esc(d.cargo):""}</p>
    <div class="tags"><span class="pill temp" style="background:${TEMPC[d.temperatura]||"var(--line-2)"}">${esc(d.temperatura)}</span><span class="pill">${esc(d.interesse)}</span>${d.origem?`<span class="pill">Veio por: ${esc(d.origem)}</span>`:""}${d.utm?`<span class="pill">${esc(d.utm)}</span>`:""}</div>
  </div></div>
  <div class="quick">
    ${zap(d.whatsapp)?`<a class="qa primary" href="${zap(d.whatsapp)}" target="_blank" rel="noopener">WhatsApp ↗</a>`:""}
    <button class="qa" type="button" data-copy="${esc(d.email)}">Copiar e-mail</button>
    ${d.instagram?`<a class="qa" href="https://instagram.com/${esc(String(d.instagram).replace(/^@/,""))}" target="_blank" rel="noopener">${esc(d.instagram)} ↗</a>`:""}
    ${d.site?`<a class="qa" href="${/^https?:/.test(d.site)?esc(d.site):"https://"+esc(d.site)}" target="_blank" rel="noopener">Site ↗</a>`:""}
  </div>
  <div class="grid">
    <div class="box"><h3>Resumo</h3><p class="resumo">${esc(d.resumo)}</p>
      ${d.pontos&&d.pontos.length?`<h3 style="margin-top:20px">Pontos para a reunião</h3><ul class="pontos">${d.pontos.map(p=>`<li><span>${esc(p)}</span></li>`).join("")}</ul>`:""}
    </div>
    <div class="box">
      <h3>Status</h3>
      <div class="stbar" role="group" aria-label="Status do briefing">${STATUS.map(s=>`<button class="stbtn" type="button" data-st="${esc(s)}" aria-pressed="${d.status===s}">${esc(s)}</button>`).join("")}</div>
      <h3 style="margin-top:20px">Contato e verba</h3>
      <dl class="facts"><dt>E-mail</dt><dd>${esc(d.email)}</dd><dt>WhatsApp</dt><dd>${esc(d.whatsapp)}</dd><dt>Prazo</dt><dd>${esc(d.prazo)}</dd><dt>Investimento</dt><dd>${esc(d.investimento)}</dd><dt>Decide</dt><dd>${esc(d.decisor)}</dd></dl>
      <h3 style="margin-top:20px">Suas notas</h3>
      <textarea class="notes" id="notes" placeholder="Anote o que saiu da conversa, próximos passos, valor proposto...">${esc(d.notas||"")}</textarea>
      <div class="saveline"><span id="noteSt">${d.notas?"Notas salvas":"Ainda sem notas"}</span><button class="smallbtn" type="button" id="saveNotes">Salvar notas</button></div>
    </div>
  </div>
  <div class="answers"><h3 style="margin-top:0">Respostas completas</h3>
    ${secs.map(s=>`<h3>${esc(s)}</h3>${d.respostas.filter(r=>r.sec===s).map(r=>`<div class="ans"><span class="q">${esc(r.q)}</span><span class="a${r.a?"":" none"}">${esc(r.a||"Sem resposta")}</span></div>`).join("")}`).join("")}
  </div>`;
  $("#back").addEventListener("click",()=>{ $("#app").classList.remove("open"); });
  document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{ try{await navigator.clipboard.writeText(b.dataset.copy);toast("E-mail copiado")}catch(e){toast(b.dataset.copy)} }));
  document.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>update(d,{status:b.dataset.st})));
  $("#saveNotes").addEventListener("click",()=>update(d,{notas:$("#notes").value}));
}
function update(d,patch){
  const prev={status:d.status,notas:d.notas}; Object.assign(d,patch); list(); detail(); kpis();
  const done=()=>toast(patch.status?`Status: ${patch.status}`:"Notas salvas");
  if(IS_DEMO){ done(); return; }
  google.script.run.withSuccessHandler(done).withFailureHandler(err=>{ Object.assign(d,prev); list(); detail(); toast("Não salvou. Confira a conexão e tente de novo."); })
    .painelAtualizar(KEY,d.id,patch.status??null,patch.notas??null);
}
["#q","#fInt","#fSt"].forEach(s=>$(s).addEventListener("input",list));
fillFilters(); kpis(); list(); detail();
if(location.hash && matchMedia("(max-width:760px)").matches) $("#app").classList.add("open");
// No Apps Script a página roda num iframe: o #ID do link do e-mail chega por google.script.url
if(!IS_DEMO && google.script.url) google.script.url.getLocation(l=>{ if(l.hash && DATA.some(x=>x.id===l.hash)){ sel=l.hash; list(); detail(); if(matchMedia("(max-width:760px)").matches) $("#app").classList.add("open"); } });
</script>

</body>
</html>
